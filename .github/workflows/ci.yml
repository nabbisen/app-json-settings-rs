name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test default features
        run: cargo test
      - name: Test no default features
        run: cargo test --no-default-features
      - name: Test executable examples
        run: cargo test --examples
      - name: Test documentation examples
        run: cargo test --doc

  lint-and-rfcs:
    name: Formatting and RFC integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Check RFC integrity
        run: scripts/check-rfcs.sh

  windows-uwp-feature-check:
    name: Windows UWP feature check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check optional UWP feature compiles
        run: cargo check --features uwp
