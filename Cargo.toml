[package]
name = "app-json-settings"
version = "2.1.0"
edition = "2024"

description = "App settings as JSON format stored in file and available via read-by-key and write-by-key. Aims a tiny settings manager with reasonably few dependencies."
authors = ["nabbisen"]
license = "Apache-2.0"

categories = ["config"]
keywords = ["json", "serde", "utility", "file"]
rust-version = "1.85.0"

[features]
default = []
uwp = ["dep:windows"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
optional = true
features = ["Storage"]
