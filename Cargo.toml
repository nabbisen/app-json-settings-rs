[package]
name        = "app-json-settings"
version     = "2.5.1"
description = "Tiny typed JSON settings persistence for Rust applications."
readme      = "README.md"
exclude     = [".vscode/"]

edition         = "2024"
rust-version    = "1.85.0"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/nabbisen/app-json-settings-rs"
categories      = ["config"]
keywords        = ["json", "serde", "settings", "config", "appdata"]

[features]
default = []
uwp = ["dep:windows"]

[dependencies]
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"

[target.'cfg(windows)'.dependencies.windows]
version             = "0.62"
optional            = true
features            = ["Storage", "Storage_Search"]
